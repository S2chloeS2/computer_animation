solver:
  # solver type. Choose from
  # - contact_penalty
  # - lcp_gs
  type: lcp_gs

  timestep: 0.0005   # timestep size

  # damping for particle-partcile contact penalty force (optional)
  particle_contact_penalty_damping: 0.01
  particle_contact_penalty_stiffness: 1000.

  # Time integrator type. Choose from
  # - symplectic
  # - midpoint
  integrator: symplectic

shapes:
  - type: mesh
    # when relative path is given, the relative path is w.r.t. the current 
    # directory of this .yml file
    file: "../meshes/monkey.obj"
    pos: [0.0, 0.0, 1.20001]
    scale: 0.8
    penalty_stiffness: 4000.
    penalty_damping: 0.9
    density: 0.1

  - type: mesh
    # when relative path is given, the relative path is w.r.t. the current 
    # directory of this .yml file
    file: "../meshes/torus.obj"
    pos: [0.0, 0.0, 2.7001]
    scale: 0.8
    penalty_stiffness: 2000.
    penalty_damping: 0.9
    density: 0.1

  - type: half_space_plane
    normal: [0.0, 0.2, 1]
    offset: 0.0
    penalty_stiffness: 1000.
    penalty_damping: 0.05
    
  - type: half_space_plane
    normal: [0, -0.2, 1]
    offset: 0.0
    penalty_stiffness: 1000.
    penalty_damping: 0.05

  - type: half_space_plane
    normal: [0.2, 0.0, 1]
    offset: 0.0
    penalty_stiffness: 1000.
    penalty_damping: 0.05
    
  - type: half_space_plane
    normal: [-0.2, 0.0, 1]
    offset: 0.0
    penalty_stiffness: 1000.
    penalty_damping: 0.05
    
