solver:
  # solver type. Choose from
  # - contact_penalty
  # - lcp_gs
  type: contact_penalty

  timestep: 0.0005   # timestep size

  # damping for particle-partcile contact penalty force (optional)
  particle_contact_penalty_damping: 0.01
  particle_contact_penalty_stiffness: 1000.

  # Time integrator type. Choose from
  # - symplectic
  # - midpoint
  integrator: symplectic

# What DOF of a particle over time to plot 
# This section is optional. If omitted, nothing will be plot.
plot:
  shape_id: 0
  # which DoF to plot. For exmaple, DoF=0 will plot x-component of the particle position;
  # DoF=2, will plot z-component of the particle position
  # NOTE: We don't support the plot of velocity yet
  dof: 2
  # y_range specifies the plot's y-axis range (lower and upper values)
  y_range: [0.4, 1.0]

shapes:
  - type: sphere
    pos: [0.0, 0.0, 1.0]
    radius: 0.5
    density: 2.0
    penalty_stiffness: 4000.
    penalty_damping: 0.9

  - type: half_space_plane
    normal: [0.0, 0.0, 1]
    offset: 0.0
    penalty_stiffness: 1000.
    penalty_damping: 0.9
    restitution: 1.0
    
