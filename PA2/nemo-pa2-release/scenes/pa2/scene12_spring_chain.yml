solver:
  type: linearized_implicit
  timestep: 0.005
  gravity: -9.81

# 4-particle hanging spring chain (rope approximation)
# particle 0 is fixed at top; 1, 2, 3 hang below
particles:
  - pos: [0, 0, 3.0]
    vel: [0, 0, 0]
    fixed: true
    mass: 1.0

  - pos: [0, 0, 2.0]
    vel: [0, 0, 0]
    fixed: false
    mass: 0.5

  - pos: [0, 0, 1.0]
    vel: [0, 0, 0]
    fixed: false
    mass: 0.5

  - pos: [0.2, 0, 0.0]
    vel: [1.0, 0, 0]
    fixed: false
    mass: 0.5

springs:
  - particle_ids: [0, 1]
    stiffness: 200.0
    damping: 1.0
    rest_length: 1.0

  - particle_ids: [1, 2]
    stiffness: 200.0
    damping: 1.0
    rest_length: 1.0

  - particle_ids: [2, 3]
    stiffness: 200.0
    damping: 1.0
    rest_length: 1.0
